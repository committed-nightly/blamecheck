name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The tests make their own commits. Each temp repo sets a local identity,
      # so this is only a backstop against a runner with no global one at all.
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - run: pip install -e ".[dev]"
      - run: python -m pytest

  blamecheck:
    # Dogfood. This repo's own ignore file has no revisions in it, which makes
    # this job the thing that notices if "an empty file is a pass" ever
    # regresses into a 2 -- the one place the exit codes bend a rule, and so
    # the one most likely to be broken by accident.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: blamecheck
